<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carmela Iannelli — Data Viz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:      #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --series-2:       #eb6834;
    --series-3:       #1baf7a;
    --shadow-rest:    0 1px 2px rgba(11,11,11,0.06), 0 1px 1px rgba(11,11,11,0.04);
    --shadow-hover:   0 12px 24px rgba(11,11,11,0.10), 0 4px 8px rgba(11,11,11,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 64px 24px 40px;
    text-align: center;
    border-bottom: 1px solid var(--gridline);
    background:
      radial-gradient(60% 140% at 50% 0%, rgba(42,120,214,0.07), transparent 70%),
      var(--surface-1);
  }
  header .eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--series-1);
    margin-bottom: 14px;
  }
  h1 {
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  header p.subtitle {
    color: var(--text-secondary);
    font-size: 16px;
    margin: 0;
    max-width: 480px;
    margin-inline: auto;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  section {
    margin-bottom: 64px;
  }
  section:last-child {
    margin-bottom: 0;
  }
  .section-heading {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 24px;
  }
  h2 {
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text-primary);
  }
  .section-heading .count {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .section-heading::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--gridline);
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .grid figure.card {
    flex: 1 1 100%;
  }
  figure.card {
    margin: 0;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-rest);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
  }
  figure.card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(42,120,214,0.25);
  }
  .card-media {
    position: relative;
    width: 100%;
    padding-top: 74.5%; /* 600 / 805 — locks the box to the SVGs' native ratio */
    background: var(--surface-1);
    overflow: hidden;
  }
  .card-media object,
  .card-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Embeds (Flourish, Datawrapper) manage their own height dynamically —
     they don't fit the fixed SVG aspect-ratio box, so this variant
     drops the ratio lock and just lets the embed size itself. */
  .card-media.embed {
    position: static;
    padding-top: 0;
    overflow: visible;
  }
  .card-media.embed .flourish-embed,
  .card-media.embed div[id^="datawrapper-vis-"] {
    position: static;
    width: 100%;
    height: auto;
  }
  figcaption {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--gridline);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .empty-state {
    border: 1px dashed var(--gridline);
    border-radius: 14px;
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    background: var(--surface-1);
  }
  footer {
    text-align: center;
    padding: 32px 24px 56px;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>Carmela Iannelli</h1>
</header>
<main>
  <section>
    <div class="section-heading">
      <h2>RawGraphs</h2>
    </div>
    <div class="grid">
      <figure class="card">
        <div class="card-media">
          <object data="UK_Energy_Flows.svg" type="image/svg+xml">
          </object>
        </div>
        <figcaption>Flujos de Energía en Reino Unido</figcaption>
      </figure>
      <figure class="card">
        <div class="card-media">
          <object data="Music_Formats.svg" type="image/svg+xml">
          </object>
        </div>
        <figcaption>Formatos de Música</figcaption>
      </figure>
      <figure class="card">
        <div class="card-media">
          <object data="Music_Format_Revenue.svg" type="image/svg+xml">
          </object>
        </div>
        <figcaption>Formatos de Música: revenue</figcaption>
      </figure>
    </div>
  </section>
  <section>
    <div class="section-heading">
      <h2>Intervenido en Inkscape</h2>
    </div>
    <div class="grid">
      <figure class="card">
        <div class="card-media">
          <object data="Te_Leche_Cafe.svg" type="image/svg+xml">
          </object>
        </div>
        <figcaption>Té, Leche, Café</figcaption>
      </figure>
    </div>
  </section>
  <section>
    <div class="section-heading">
      <h2>Flourish</h2>
    </div>
    <div class="grid">
      <figure class="card">
        <div class="card-media embed">
          <div class="flourish-embed flourish-chart" data-src="visualisation/30014147"><script src="https://public.flourish.studio/resources/embed.js"></script><noscript><img src="https://public.flourish.studio/visualisation/30014147/thumbnail" width="100%" alt="chart visualization" /></noscript></div>
        </div>
        <figcaption>Flourish — Tasas según Muertos, Heridos y Otros</figcaption>
      </figure>
      <figure class="card">
        <div class="card-media embed">
          <div class="flourish-embed flourish-chart" data-src="visualisation/30014225"><script src="https://public.flourish.studio/resources/embed.js"></script><noscript><img src="https://public.flourish.studio/visualisation/30014225/thumbnail" width="100%" alt="chart visualization" /></noscript></div>
        </div>
        <figcaption>Flourish — Totalidad de Muertos, Heridos y Otros</figcaption>
      </figure>
    </div>
  </section>
  <section>
    <div class="section-heading">
      <h2>Datawrapper</h2>
    </div>
    <div class="grid">
      <figure class="card">
        <div class="card-media embed">
          <div style="min-height:449px" id="datawrapper-vis-dFBcD"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/dFBcD/embed.js" charset="utf-8" data-target="#datawrapper-vis-dFBcD"></script><noscript><img src="https://datawrapper.dwcdn.net/dFBcD/full.png" alt="Pizza toppings: male's  and female's  choices (Range Plot)" /></noscript></div>
        </div>
        <figcaption>Pizza toppings: elección de hombres y mujeres</figcaption>
      </figure>
    </div>
  </section>
  
  <section>
    <div class="section-heading">
      <h2>Tableau</h2>
    </div>
    <div class="grid">
      <figure class="card">
        <div class="card-media embed">
          <div class='tableauPlaceholder' id='viz1788907823476' style='position: relative'><noscript><a href='#'><img alt='Uso de aplicaciones segun tiempo y cantidad de aperturas ' src='https:&#47;&#47;public.tableau.com&#47;static&#47;images&#47;Us&#47;Usodeappsseguntiempoyaperturas&#47;Sheet1&#47;1_rss.png' style='border: none' /></a></noscript><object class='tableauViz'  style='display:none;'><param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' /> <param name='embed_code_version' value='3' /> <param name='site_root' value='' /><param name='name' value='Usodeappsseguntiempoyaperturas&#47;Sheet1' /><param name='tabs' value='no' /><param name='toolbar' value='yes' /><param name='static_image' value='https:&#47;&#47;public.tableau.com&#47;static&#47;images&#47;Us&#47;Usodeappsseguntiempoyaperturas&#47;Sheet1&#47;1.png' /> <param name='animate_transition' value='yes' /><param name='display_static_image' value='yes' /><param name='display_spinner' value='yes' /><param name='display_overlay' value='yes' /><param name='display_count' value='yes' /><param name='language' value='es-ES' /></object></div>
          <script type='text/javascript'>
            var divElement = document.getElementById('viz1788907823476');
            var vizElement = divElement.getElementsByTagName('object')[0];
            vizElement.style.width='100%';vizElement.style.height=(divElement.offsetWidth*0.75)+'px';
            var scriptElement = document.createElement('script');
            scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
            vizElement.parentNode.insertBefore(scriptElement, vizElement);
          </script>
        </div>
        <figcaption>Uso de aplicaciones según tiempo y cantidad de aperturas</figcaption>
      </figure>
    </div>
  </section>
  
</main>
</body>
</html>
